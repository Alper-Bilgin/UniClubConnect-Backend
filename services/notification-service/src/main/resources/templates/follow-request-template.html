<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; background-color:#f7f7f7; padding: 20px;">
<div style="max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; text-align: center;">
    <h2 style="color:#2c3e50;">Merhaba <span th:text="${targetName}"></span>,</h2>
    <div style="background-color:#f0f3f7; padding:20px; border-radius:8px; margin:25px 0; border-left:5px solid #e67e22;">
        <p style="font-size:16px;">
            <strong><span th:text="${actorName}"></span></strong> seni takip etmek istiyor.
        </p>
        <p style="font-size:14px; color:#555;">İsteği onaylamak veya reddetmek için uygulamaya giriş yap.</p>
    </div>
    <p style="font-size:12px; color:gray;">© 2026 UniClub Connect</p>
</div>
</body>
</html>
