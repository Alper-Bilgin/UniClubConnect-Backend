<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0; padding:0; font-family: Arial, Helvetica, sans-serif; background-color:#f7f7f7;">
<table width="100%" cellpadding="0" cellspacing="0" style="padding: 30px 0;">
    <tr>
        <td align="center">

            <table width="600" cellpadding="0" cellspacing="0" style="background:white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                <tr>
                    <td style="text-align:center;">
                        <h2 style="color:#2c3e50; font-size:24px; margin-bottom:10px;">
                            Hoş Geldin, <span th:text="${name}"></span>!
                        </h2>
                        <p style="color:#555; font-size:15px; margin-top:0;">
                            UniClub Connect ailesine katıldığın için çok mutluyuz.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td>
                        <div style="background-color:#f0f3f7; padding:20px; border-radius:8px; margin:25px 0; border-left:5px solid #4a6fa1;">
                            <p style="margin:0; color:#333; font-size:15px;">Hesabını doğrulamak için aşağıdaki kodu kullan:</p>

                            <h1 style="letter-spacing:6px; color:#2c3e50; text-align:center; margin:20px 0; font-size:36px;"
                                th:text="${code}">
                            </h1>

                            <p style="font-size:12px; color:gray; text-align:center; margin:0;">
                                Bu kod 5 dakika geçerlidir.
                            </p>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td style="text-align:center; font-size:13px; color:#888; padding-top:10px;">
                        © 2025 UniClub Connect – Tüm hakları saklıdır.
                    </td>
                </tr>
            </table>

        </td>
    </tr>
</table>
</body>
</html>
