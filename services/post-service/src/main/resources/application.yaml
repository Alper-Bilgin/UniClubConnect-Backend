spring:
  application:
    name: post-service
  config:
    import: "configserver:"
  cloud:
    config:
      uri: http://localhost:8888
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
gamification:
  rabbitmq:
    exchange: gamification.exchange
    routing-key: gamification.event.post.created